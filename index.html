<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#14141c" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <title>SWAPRISE</title>
    <style>
      html, body { margin: 0; padding: 0; background: #14141c; height: 100%; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      /* ノッチ・ホームインジケータを避ける。#app が safe-area ぶんの余白を持ち、Phaser は内側の #game に収める */
      #app { box-sizing: border-box; width: 100vw; height: 100vh; height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
      /* 中央寄せは Phaser の autoCenter に任せる。CSS でも寄せると二重にずれる */
      #game { width: 100%; height: 100%; }
      canvas { touch-action: none; }
    </style>
  </head>
  <body>
    <div id="app"><div id="game"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
