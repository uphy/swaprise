name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ブランチ保護の必須 check は、分割した検証がすべて成功した場合だけ成功する。
  check:
    if: always()
    needs: [unit, e2e, e2e-online]
    runs-on: ubuntu-latest
    steps:
      - name: すべての検証結果を確認
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Update alongside the locked @playwright/test version.
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright
        timeout-minutes: 2
      - run: pnpm e2e
        env:
          CI: "1"
      - name: 失敗したテストのスクリーンショットと trace を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7

  e2e-online:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --init --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/playwright
        timeout-minutes: 2
      # 各 runner で別々の Wrangler を起動するので、待機列も部屋も混ざらない。
      - run: pnpm e2e:online --shard=${{ matrix.shard }}/3
        env:
          CI: "1"
          WRANGLER_LOG_PATH: ./test-server-logs
      - name: 失敗したテストのスクリーンショットと trace を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-online-results-${{ matrix.shard }}
          path: |
            test-results-online/
            test-server-logs/
          retention-days: 7

  # 普段の pnpm test に入れていない、CPU に何分も遊ばせるバランスの回帰テスト
  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:balance

  # PR専用Workerに公開し、本番とDOの部屋・待機列を分離する。
  # スマホで実機確認してから merge するために使う。URL は PR のコメントに書き、同じコメントを更新する
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
      - name: プレビュー版をアップロード
        id: upload
        run: |
          node tools/prepare-preview.mjs
          node tools/prepare-score-database.mjs .wrangler-preview.json .wrangler-preview.json
          pnpm exec wrangler deploy -c .wrangler-preview.json | tee upload.log
          url=$(grep -o 'https://[a-z0-9.-]*workers\.dev' upload.log | head -1)
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: PR にプレビュー URL をコメント
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 目印の HTML コメントは1行で独立させ、空行で区切る。同じ行に続けて書くと、行全体が HTML ブロック扱いになって
          # URL がリンクにならない（プレーンテキストのまま）
          body="<!-- preview-url -->

          プレビュー: [${URL}](${URL})
          （commit ${SHA:0:7} の版。本番の URL は変わらない）"
          existing=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --jq '.[] | select(.body | startswith("<!-- preview-url -->")) | .id' | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -f body="$body" > /dev/null
          else
            gh pr comment "${{ github.event.pull_request.number }}" --body "$body"
          fi
