name: preview-cleanup

# PR を閉じたら（merge を含む）、その PR 専用のプレビューを片付ける。
# ci.yml の preview ジョブは PR ごとに Worker `swaprise-pr-<番号>` と D1 `swaprise-pr-<番号>-scores` を作る。
# 放っておくと D1 がアカウントの上限（10 個）に当たり、新しい PR の preview が
# "System limit reached: databases per account" で失敗する（#40 で発生）。
on:
  pull_request:
    types: [closed]

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: プレビューの Worker と D1 を消す
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # preview ジョブと同じ名前の設定を作って、その Worker を消す（DO の名前空間も一緒に消える）。
          # preview が走らなかった PR では無いので、無くても失敗にしない
          node tools/prepare-preview.mjs
          pnpm exec wrangler delete -c .wrangler-preview.json --force || echo "Worker swaprise-pr-${PR_NUMBER} は無いか、消せなかった"
          pnpm exec wrangler d1 delete "swaprise-pr-${PR_NUMBER}-scores" -y || echo "D1 swaprise-pr-${PR_NUMBER}-scores は無いか、消せなかった"
