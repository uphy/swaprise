<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>継ぎ市 キャラクター画廊</title><link rel="stylesheet" href="gallery.css"><script defer src="actions.js"></script><script defer src="catalog.js"></script><script defer src="gallery.js"></script></head>
<body><header><a href="../README.md">SWAPRISE / 継ぎ市</a><h1>キャラクター画廊</h1><p>住人たちの姿と動き。キャラクターを選んで、画像とアニメーションを確認できます。</p><span id="summary"></span></header>
<main><aside><label for="search">キャラクターを探す</label><input id="search" type="search" placeholder="名前・仕事で検索"><nav id="characters" aria-label="キャラクター一覧"></nav></aside>
<section aria-labelledby="name"><div class="heading"><div><small id="role"></small><h2 id="name"></h2></div><a id="profile">人物設定を読む ↗</a></div><div id="coverage" class="coverage"></div><div id="assets" class="tabs" aria-label="画像の種類"></div>
<div id="empty" hidden><h3>まだ画像がありません</h3><p>最初の一枚を追加すると、ここに表示されます。</p></div>
<div id="viewer" hidden><div class="version-picker"><label for="version">バージョン</label> <select id="version"></select><p id="adoption"></p></div><div class="stage" id="stage"><canvas width="384" height="432" role="img"></canvas><img id="still" alt="" hidden></div><div class="controls"><button id="play">再生</button><button id="next">次のコマ</button><output id="counter"></output><output id="playback"></output><label>速度 <input id="fps" type="range" min="1" max="30" value="6"><output id="rate">6fps</output></label></div><div class="controls"><label>表示 <select id="mode"><option value="animation">アニメーション</option><option value="sheet">元画像</option></select></label><label>背景 <select id="background"><option value="check">市松</option><option value="dark">紺</option><option value="light">生成り</option></select></label><label><input type="checkbox" id="guide">中心線</label></div><p id="status" role="status"></p><p id="notes"></p><div id="links" class="links"></div><details><summary>生成情報・過去の試作</summary><p id="model"></p><div id="history" class="links"></div></details></div></section></main><footer>画像を追加する手順は <a href="README.md">画廊の管理ガイド</a> にまとめています。</footer></body></html>
