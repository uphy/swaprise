<p class="note">音声ファイルは使わず、ゲーム本体と同じく Web Audio のオシレータだけで鳴らしています。気に入った案の番号を教えてください。数字キーで再生、Esc または Space で停止。</p>

<script>
'use strict';

// ============================================================ 音符・パターン
const NOTE_IDX = { c:0,'c#':1,db:1,d:2,'d#':3,eb:3,e:4,f:5,'f#':6,gb:6,g:7,'g#':8,ab:8,a:9,'a#':10,bb:10,b:11 };
function noteFreq(name) {
  const m = /^([a-g])([#b]?)(-?\d)$/.exec(name);
  if (!m) throw new Error('音名が不正: ' + name);
  const midi = (Number(m[3]) + 1) * 12 + NOTE_IDX[m[1] + m[2]];
  return 440 * Math.pow(2, (midi - 69) / 12);
}

// "c4:2 e4+g4:4 r:2" → 16分音符単位のイベント列。len 省略時は 1（16分）。r は休符。
function parseSeq(seq) {
  const events = new Map();
  let step = 0;
  for (const tok of seq.trim().split(/\s+/)) {
    if (!tok) continue;
    const [body, lenStr] = tok.split(':');
    const len = lenStr === undefined ? 1 : Number(lenStr);
    if (!(len > 0)) throw new Error('長さが不正: ' + tok);
    if (body !== 'r') events.set(step, { freqs: body.split('+').map(noteFreq), len });
    step += len;
  }
  return { events, total: step };
}

// "x...x..." → ドラム。x=ヒット、o=オープン(ハイハット)、. = 休み。空白は無視。
function parseDrum(pat, kind) {
  const s = pat.replace(/\s+/g, '');
  const events = new Map();
  for (let i = 0; i < s.length; i++) {
    if (s[i] === 'x' || s[i] === 'o') events.set(i, { drum: kind, open: s[i] === 'o', len: 1 });
  }
  return { events, total: s.length };
}

const rep = (s, n) => Array(n).fill(s).join(' ');
// コード列をアルペジオに展開。pattern はコード構成音のインデックス列。
function arpSeq(chords, pattern, perChord, len = 1) {
  const out = [];
  for (const c of chords) {
    for (let i = 0; i < perChord; i++) {
      const n = c[pattern[i % pattern.length] % c.length];
      out.push(len === 1 ? n : `${n}:${len}`);
    }
  }
  return out.join(' ');
}
const chordTok = (notes) => notes.join('+');

// ============================================================ 楽器
// a/d/s/r: ADSR(秒, s は比率)。cutoff: ローパス。fenv: 発音時にカットオフを何倍から下げるか。
// vib: ビブラート(cents)。gate: 音符長のうち鳴らす割合。echo: エコー送り量。

  arpThin:   { wave:'pulse12', gain:0.11, a:0.002, d:0.06, s:0.3, r:0.03, cutoff:6000, gate:0.6, echo:0.4 },
  leadSq:    { wave:'square', gain:0.15, a:0.01, d:0.12, s:0.75, r:0.08, cutoff:3800, vib:{ rate:5.5, depth:10, delay:0.12 }, gate:0.9, echo:0.3 },
  leadPulse: { wave:'pulse25', wave2:'pulse25', detune2:7, mix2:0.6, gain:0.13, a:0.01, d:0.1, s:0.8, r:0.08, cutoff:4200, vib:{ rate:6, depth:12, delay:0.1 }, gate:0.9, echo:0.3 },
  flute:     { wave:'sine', wave2:'triangle', mix2:0.6, gain:0.28, a:0.04, d:0.15, s:0.85, r:0.15, cutoff:5000, vib:{ rate:5, depth:14, delay:0.2 }, gate:0.95, echo:0.45 },

  pad:       { wave:'pulse25', wave2:'sawtooth', mix2:0.5, detune2:9, gain:0.055, a:0.5, d:0.4, s:0.85, r:0.6, cutoff:1600, gate:0.98, echo:0.5 },
  sineLead:  { wave:'sine', wave2:'triangle', mix2:0.35, gain:0.3, a:0.03, d:0.2, s:0.8, r:0.3, cutoff:4000, vib:{ rate:4.5, depth:12, delay:0.25 }, gate:0.95, echo:0.55 },

// ============================================================ 曲
const SONGS = [];

// ---- 1. ポップ・フェアリー
{

        'e5:2 g5:2 e5:2 c5:2 d5:4 e5:4',
        'd5:2 g5:2 b5:2 g5:2 d5:2 b4:2 d5:4',

      ].join(' ') },

{

      { inst:'flute', seq: [
        'g5:6 e5:2 c5:4',
        'd5:8 e5:4',
        'f5:4 a5:4 c6:4',

        'b5:6 g5:2 e5:4',
        'f5:4 g5:4 a5:4',
        'd6:8 b5:4',
      ].join(' ') },
      { drum:'kick', pat:'x...........' },
      { drum:'rim',  pat:'....x...x...' },
    ],
  });
}

{

  const stab = (k) => { const X = chordTok(S[k]); return `r:2 ${X}:1 r:3 ${X}:2 r:4 ${X}:1 r:3`; };

    spec: 'ベース: 三角波+ノコギリ波 / 刻み: 25%パルスのコードスタブ / 旋律: クラビ風の短い減衰パルス / 16分をスウィング',

// ============================================================ メニュー曲の候補（docs/menu-music-design.md）
// 7〜9 は「1. ポップ・フェアリー」の置き換え候補。どれも 16 小節（A 8 + B 8）で、A は主題、B は間を空けた息継ぎ。

// ---- 7. せり上がりのテーマ（推奨）
{
  const C4 = { C:['c4','e4','g4','c5'], Em:['e4','g4','b4','e5'], Am:['a3','c4','e4','a4'], F:['f3','a3','c4','f4'], G:['g3','b3','d4','g4'] };
  const B = { C:['c2','c3','g2'], Em:['e2','e3','b2'], Am:['a2','a3','e3'], F:['f2','f3','c3'], G:['g2','g3','d3'] };
  const P = { Am:['a3','c4','e4','a4'], F:['f3','a3','c4','f4'], C:['c4','e4','g4','c5'], G:['g3','b3','d4','g4'] };
  const progA = ['C','Em','Am','F','C','G','F','G'];

// ============================================================ 検証
function buildSong(song) {
  const tracks = song.tracks.map((t) => {
    if (t.drum) return { ...parseDrum(t.pat, t.drum), drum: t.drum };
    if (!INST[t.inst]) throw new Error('楽器がない: ' + t.inst);
    return { ...parseSeq(t.seq), inst: INST[t.inst], name: t.inst };
  });
  const warnings = [];
  for (const tr of tracks) {
    if (tr.total % song.beat !== 0) warnings.push(`${song.name} / ${tr.name || tr.drum}: 長さ ${tr.total} が小節(${song.beat})の倍数でない`);
  }
  return { tracks, warnings };
}
const ALL_WARNINGS = [];
for (const s of SONGS) ALL_WARNINGS.push(...buildSong(s).warnings);
if (typeof document === 'undefined') {
  console.log(ALL_WARNINGS.length ? ALL_WARNINGS.join('\n') : 'OK: すべての曲の小節長が揃っています');
  for (const s of SONGS) console.log(s.name, buildSong(s).tracks.map((t) => `${t.name || t.drum}=${t.total}`).join(' '));
}

// ============================================================ 音声エンジン
class Engine {
  constructor() { this.ctx = null; this.cur = null; this.danger = false; this.echoOn = true; this.volume = 0.6; }

  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const ctx = new AudioContext();
    this.ctx = ctx;
    this.master = ctx.createGain();
    this.master.gain.value = this.volume;
    // SFC の音の丸さを出すために高域を削り、軽く圧縮する
    this.tone = ctx.createBiquadFilter();
    this.tone.type = 'lowpass'; this.tone.frequency.value = 9000; this.tone.Q.value = 0.5;
    this.comp = ctx.createDynamicsCompressor();
    this.comp.threshold.value = -18; this.comp.knee.value = 12; this.comp.ratio.value = 3;
    this.comp.attack.value = 0.005; this.comp.release.value = 0.15;
    this.master.connect(this.tone); this.tone.connect(this.comp); this.comp.connect(ctx.destination);

    // エコー（SPC700 風のフィードバックディレイ）
    this.echoIn = ctx.createGain();
    this.delay = ctx.createDelay(2);
    this.delay.delayTime.value = 0.3;
    this.fb = ctx.createGain(); this.fb.gain.value = 0.35;
    this.fbFilter = ctx.createBiquadFilter(); this.fbFilter.type = 'lowpass'; this.fbFilter.frequency.value = 3000;
    this.echoOut = ctx.createGain(); this.echoOut.gain.value = this.echoOn ? 1 : 0;
    this.echoIn.connect(this.delay);
    this.delay.connect(this.fbFilter); this.fbFilter.connect(this.fb); this.fb.connect(this.delay);
    this.delay.connect(this.echoOut); this.echoOut.connect(this.master);

    this.waves = { pulse25: this.makePulse(0.25), pulse12: this.makePulse(0.125) };
    const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
    const d = nb.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noiseBuf = nb;
  }

  makePulse(duty) {
    const n = 48, real = new Float32Array(n), imag = new Float32Array(n);
    for (let k = 1; k < n; k++) real[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * duty);
    return this.ctx.createPeriodicWave(real, imag);
  }

  setVolume(v) { this.volume = v; if (this.master) this.master.gain.value = v; }
  setEcho(on) { this.echoOn = on; if (this.echoOut) this.echoOut.gain.value = on ? 1 : 0; }
  setDanger(on) { this.danger = on; }

  tempo() { return this.cur ? this.cur.song.tempo * (this.danger ? 1.3 : 1) : 120; }

  makeOsc(wave, freq, t0) {
    const osc = this.ctx.createOscillator();
    if (this.waves[wave]) osc.setPeriodicWave(this.waves[wave]); else osc.type = wave;
    osc.frequency.setValueAtTime(freq, t0);
    return osc;
  }

  playNote(inst, freq, t0, dur) {
    const ctx = this.ctx;
    const env = ctx.createGain();
    const peak = inst.gain;
    let tEnd;
    if (inst.decayToEnd) {
      env.gain.setValueAtTime(peak, t0);
      env.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      tEnd = t0 + dur;
    } else {
      env.gain.setValueAtTime(0, t0);
      env.gain.linearRampToValueAtTime(peak, t0 + inst.a);
      const tDec = t0 + inst.a + inst.d;
      env.gain.linearRampToValueAtTime(peak * inst.s, tDec);
      const tRel = Math.max(t0 + dur, tDec);
      env.gain.setValueAtTime(peak * inst.s, tRel);
      env.gain.linearRampToValueAtTime(0, tRel + inst.r);
      tEnd = tRel + inst.r;
    }
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.Q.value = 0.8;
    if (inst.fenv) {
      filter.frequency.setValueAtTime(Math.min(18000, inst.cutoff * inst.fenv), t0);
      filter.frequency.exponentialRampToValueAtTime(inst.cutoff, t0 + (inst.d || 0.1));
    } else {
      filter.frequency.value = inst.cutoff;
    }
    const oscs = [this.makeOsc(inst.wave, freq, t0)];
    const mix1 = ctx.createGain(); mix1.gain.value = inst.wave2 ? 1 - inst.mix2 * 0.5 : 1;
    oscs[0].connect(mix1); mix1.connect(filter);
    if (inst.wave2) {
      const o2 = this.makeOsc(inst.wave2, freq, t0);
      if (inst.detune2) o2.detune.value = inst.detune2;
      const mix2 = ctx.createGain(); mix2.gain.value = inst.mix2;
      o2.connect(mix2); mix2.connect(filter);
      oscs.push(o2);
    }
    if (inst.vib) {
      const lfo = ctx.createOscillator(); lfo.frequency.value = inst.vib.rate;
      const lg = ctx.createGain();
      lg.gain.setValueAtTime(0, t0);
      lg.gain.linearRampToValueAtTime(inst.vib.depth, t0 + inst.vib.delay + 0.15);
      lfo.connect(lg);
      for (const o of oscs) lg.connect(o.detune);
      lfo.start(t0); lfo.stop(tEnd + 0.05);
    }
    filter.connect(env);
    env.connect(this.master);
    if (inst.echo) { const s = ctx.createGain(); s.gain.value = inst.echo; env.connect(s); s.connect(this.echoIn); }
    for (const o of oscs) { o.start(t0); o.stop(tEnd + 0.05); }
  }

  noiseVoice(t0, dur, filterType, freq, gain, echo = 0) {
    const ctx = this.ctx;
    const src = ctx.createBufferSource(); src.buffer = this.noiseBuf;
    src.loop = true;
    const f = ctx.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; f.Q.value = 0.8;
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(this.master);
    if (echo) { const s = ctx.createGain(); s.gain.value = echo; g.connect(s); s.connect(this.echoIn); }
    src.start(t0); src.stop(t0 + dur + 0.02);
  }

  toneVoice(t0, dur, type, f0, f1, gain, echo = 0) {
    const ctx = this.ctx;
    const o = ctx.createOscillator(); o.type = type;
    o.frequency.setValueAtTime(f0, t0);
    if (f1) o.frequency.exponentialRampToValueAtTime(f1, t0 + dur * 0.5);
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g); g.connect(this.master);
    if (echo) { const s = ctx.createGain(); s.gain.value = echo; g.connect(s); s.connect(this.echoIn); }
    o.start(t0); o.stop(t0 + dur + 0.02);
  }

  playDrum(kind, open, t0, level) {
    switch (kind) {
      case 'kick':
        this.toneVoice(t0, 0.28, 'sine', 160, 45, 0.9 * level);
        this.noiseVoice(t0, 0.015, 'lowpass', 2500, 0.3 * level);
        break;
      case 'snare':
        this.noiseVoice(t0, 0.16, 'bandpass', 1800, 0.45 * level, 0.3);
        this.toneVoice(t0, 0.08, 'triangle', 190, 0, 0.3 * level);
        break;
      case 'hat':
        this.noiseVoice(t0, open ? 0.3 : 0.045, 'highpass', 7500, 0.22 * level, open ? 0.2 : 0);
        break;
      case 'rim':
        this.toneVoice(t0, 0.04, 'triangle', 900, 0, 0.25 * level, 0.3);
        this.noiseVoice(t0, 0.03, 'bandpass', 3000, 0.15 * level);
        break;
    }
  }

  play(song) {
    this.init();
    this.stop();
    const { tracks } = buildSong(song);
    this.fb.gain.value = song.echoFeedback ?? 0.35;
    this.cur = { song, tracks, step: 0, nextTime: this.ctx.currentTime + 0.08, timer: null, echoAmount: song.echoAmount ?? 1 };
    this.tick();
  }

  tick() {
    const cur = this.cur;
    if (!cur) return;
    const ctx = this.ctx;
    const stepDur = 60 / this.tempo() / 4;
    this.delay.delayTime.setTargetAtTime(stepDur * cur.song.echoSteps, ctx.currentTime, 0.05);
    const drumGain = cur.song.drumGain ?? 1;
    while (cur.nextTime < ctx.currentTime + 0.12) {
      const s = cur.step;
      const swingOfs = s % 2 === 1 ? cur.song.swing * stepDur / 3 : 0;
      const t = cur.nextTime + swingOfs;
      for (const tr of cur.tracks) {
        const ev = tr.events.get(s % tr.total);
        if (!ev) continue;
        if (ev.drum) { this.playDrum(ev.drum, ev.open, t, drumGain); continue; }
        const inst = cur.echoAmount === 0 ? { ...tr.inst, echo: 0 } : tr.inst;
        const dur = ev.len * stepDur * inst.gate;
        for (const f of ev.freqs) this.playNote(inst, f, t, dur);
      }
      cur.nextTime += stepDur;
      cur.step++;
    }
    cur.timer = setTimeout(() => this.tick(), 30);
  }

  stop() {
    if (!this.cur) return;
    clearTimeout(this.cur.timer);
    this.cur = null;
  }
}

// ============================================================ UI
if (typeof document !== 'undefined') {
  const engine = new Engine();
  const list = document.getElementById('list');
  const status = document.getElementById('status');
  document.getElementById('warn').textContent = ALL_WARNINGS.join('\n');
  const cards = [];

  const refresh = () => {
    cards.forEach((c, i) => {
      const playing = engine.cur && engine.cur.song === SONGS[i];
      c.card.classList.toggle('playing', !!playing);
      c.btn.textContent = playing ? '停止' : '再生';
      c.btn.classList.toggle('primary', !playing);
    });
    status.textContent = engine.cur ? `再生中: ${engine.cur.song.name}` : '';
  };
  const toggle = (i) => {
    const s = SONGS[i];
    if (engine.cur && engine.cur.song === s) engine.stop(); else engine.play(s);
    refresh();
  };

  SONGS.forEach((s, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2><span>${s.name}</span><span class="key">${s.key}</span></h2><p class="desc">${s.desc}</p><p class="spec">${s.spec}</p>`;
    const btn = document.createElement('button');
    btn.className = 'primary';
    btn.textContent = '再生';
    btn.addEventListener('click', () => toggle(i));
    card.appendChild(btn);
    list.appendChild(card);
    cards.push({ card, btn });
  });

  document.getElementById('vol').addEventListener('input', (e) => engine.setVolume(Number(e.target.value)));
  document.getElementById('danger').addEventListener('change', (e) => engine.setDanger(e.target.checked));
  document.getElementById('echo').addEventListener('change', (e) => engine.setEcho(e.target.checked));
  document.getElementById('stopAll').addEventListener('click', () => { engine.stop(); refresh(); });
  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'Escape' || e.key === ' ') { e.preventDefault(); engine.stop(); refresh(); return; }
    const n = Number(e.key);
    if (n >= 1 && n <= SONGS.length) toggle(n - 1);
  });
}
</script>
