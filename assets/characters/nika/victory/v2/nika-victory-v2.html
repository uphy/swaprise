<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ニカ・勝利モーション24コマ版</title><style>body{margin:0;padding:24px;background:#f3ede2;color:#403529;font:16px system-ui;display:grid;justify-items:center;gap:16px}h1{font-size:22px;margin:0}p{margin:0;max-width:680px;line-height:1.7}canvas{width:min(384px,90vw);height:auto;background:#eee;border-radius:12px}button,input{font:inherit}button{padding:8px 16px;border:1px solid #b9a992;border-radius:8px;background:white;cursor:pointer}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}a{color:#765120}small{max-width:680px;line-height:1.6}</style><h1>ニカ・勝利モーション24コマ版</h1><p>8コマ版に対して、間のポーズを補った24コマの試作です。標準12fpsで再生し、最後に少し間を置きます。</p><canvas width="384" height="432" role="img" aria-label="ニカの24コマ勝利アニメーション"></canvas><div class="controls"><button id="play" disabled>読み込み中</button><button id="next" disabled>次のコマ</button><label>再生速度 <input id="fps" type="range" min="8" max="24" step="1" value="12"><output id="rate">12fps</output></label><output id="counter">1 / 24</output></div><p><a href="../v1/nika-victory-v1.html">前の8コマ版</a> · <a href="nika-victory-v2.png">24コマの画像</a> · <a href="nika-victory-v2.prompt.txt">生成プロンプト</a></p><small>内蔵画像生成ツールを使用。モデル名は未確認です。市松模様は画像に含まれています。衣装や姿勢の細かな揺れも残っているため、ゲーム組み込み前の動作確認用です。</small><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),play=document.querySelector('#play'),next=document.querySelector('#next'),fps=document.querySelector('#fps'),rate=document.querySelector('#rate'),counter=document.querySelector('#counter'),sheet=new Image();let frame=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=null,elapsed=0,ready=false;const rows=[0,265,530,771,1024],baselines=[261,527,767,1020],scale=1.35;function draw(){if(!ready)return;let row=Math.floor(frame/6),sx=frame%6*256,sy=rows[row],sh=rows[row+1]-sy,dy=canvas.height-24-(baselines[row]-sy)*scale;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(sheet,sx,sy,256,sh,(canvas.width-256*scale)/2,dy,256*scale,sh*scale);counter.textContent=`${frame+1} / 24`;play.textContent=playing?'一時停止':'再生'}function duration(){return 1000/Number(fps.value)+(frame===23?450:0)}function tick(now){if(last!==null&&playing&&ready&&!document.hidden){elapsed+=Math.min(now-last,200);let changed=false;while(elapsed>=duration()){elapsed-=duration();frame=(frame+1)%24;changed=true}if(changed)draw()}last=now;requestAnimationFrame(tick)}play.onclick=()=>{playing=!playing;elapsed=0;last=null;draw()};next.onclick=()=>{playing=false;frame=(frame+1)%24;elapsed=0;draw()};fps.oninput=()=>{rate.textContent=fps.value+'fps';elapsed=0};document.addEventListener('visibilitychange',()=>{last=null;elapsed=0});sheet.onload=()=>{ready=true;play.disabled=next.disabled=false;draw();requestAnimationFrame(tick)};sheet.onerror=()=>{play.textContent='画像を読み込めません';};sheet.src='nika-victory-v2.png';
</script></html>
