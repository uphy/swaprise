<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ニカ・勝利モーション試作</title><style>
body{margin:0;background:#f3ede2;color:#403529;font:16px system-ui;display:grid;justify-items:center;gap:16px;padding:24px;box-sizing:border-box}h1{font-size:22px;margin:0}p{margin:0;max-width:640px;line-height:1.7}.stage{width:362px;height:543px;background-image:url(nika-victory-v1.png);background-size:1448px 1086px;background-repeat:no-repeat;background-position:0 0}button,input{font:inherit}button{padding:8px 16px;border:1px solid #b9a992;border-radius:8px;background:white;cursor:pointer}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}a{color:#765120}small{max-width:640px;line-height:1.6}@media(max-width:410px){body{padding:12px}.stage{zoom:.85}}
</style><h1>ニカ・勝利モーション試作</h1><p>喜んで跳ね、落ちそうな工具袋を押さえる8コマ。元画像を等分して再生しています。</p><div class="stage" role="img" aria-label="ニカの勝利アニメーション"></div><div class="controls"><button id="play">一時停止</button><button id="next">次のコマ</button><label>速度 <input id="speed" type="range" min=".5" max="2" step=".25" value="1"></label><output id="counter">1 / 8</output></div><p><a href="nika-victory-v1.png">全コマの画像</a> · <a href="nika-victory-v1.prompt.txt">生成プロンプト</a></p><small>内蔵画像生成ツールで作成。モデル名は応答に含まれず、GPT Image 2.5の使用は未確認です。足元の位置や開始・終了姿勢の一致は仕上げ前の状態です。</small><script>
const stage=document.querySelector('.stage'),counter=document.querySelector('#counter'),play=document.querySelector('#play'),speed=document.querySelector('#speed');const durations=[650,150,110,180,120,180,180,650];let frame=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,timer;function draw(){stage.style.backgroundPosition=`${-(frame%4)*362}px ${-Math.floor(frame/4)*543}px`;counter.textContent=`${frame+1} / 8`;play.textContent=playing?'一時停止':'再生'}function schedule(){clearTimeout(timer);if(playing)timer=setTimeout(()=>{frame=(frame+1)%8;draw();schedule()},durations[frame]/Number(speed.value))}play.onclick=()=>{playing=!playing;draw();schedule()};document.querySelector('#next').onclick=()=>{playing=false;frame=(frame+1)%8;draw();schedule()};speed.oninput=schedule;draw();schedule();
</script></html>
