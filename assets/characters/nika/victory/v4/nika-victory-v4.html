<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ニカ・透過背景の24コマ版</title><style>body{margin:0;padding:24px;background:#f3ede2;color:#403529;font:16px system-ui;display:grid;justify-items:center;gap:16px}h1{font-size:22px;margin:0}p{margin:0;max-width:680px;line-height:1.7}canvas{background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;width:min(384px,90vw);height:auto;background-color:#eee;border-radius:12px}button,input{font:inherit}button{padding:8px 16px;border:1px solid #b9a992;border-radius:8px;background:white;cursor:pointer}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}a{color:#765120}small{max-width:680px;line-height:1.6}</style><h1>ニカ・透過背景の24コマ版</h1><p>各コマの腰の位置を画面中央に揃えて再生します。「横ずれ補正」で変更前と比較できます。標準12fps。</p><canvas width="384" height="432" role="img" aria-label="ニカの24コマ勝利アニメーション"></canvas><div class="controls"><button id="play" disabled>読み込み中</button><button id="next" disabled>次のコマ</button><button id="background">背景：市松</button><button id="align" aria-pressed="true">横ずれ補正：ON</button><label><input id="guide" type="checkbox">中心線</label><label>再生速度 <input id="fps" type="range" min="8" max="24" step="1" value="12"><output id="rate">12fps</output></label><output id="counter">1 / 24</output></div><p><a href="../v2/nika-victory-v2.html">前の24コマ版</a> · <a href="../v1/nika-victory-v1.html">8コマ版</a> · <a href="nika-victory-v4.png">24コマの画像</a> · <a href="nika-victory-v4.prompt.txt">生成プロンプト</a></p><small>内蔵画像生成ツールを使用。モデル名は未確認です。背景のアルファ値が0であることを確認済みです。顔や服の細部は前の版と異なります。画像自体は変更せず、紺色のズボン上部から求めた各コマの基準点を使って、表示時のX座標を補正しています。倍率とジャンプの上下動は維持しています。体形や描線の揺れは生成画像に残っています。</small><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),play=document.querySelector('#play'),next=document.querySelector('#next'),fps=document.querySelector('#fps'),rate=document.querySelector('#rate'),counter=document.querySelector('#counter'),sheet=new Image();let frame=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,last=null,elapsed=0,ready=false;const rows=[0,256,512,768,1024],baselines=[252,508,764,1020],scale=1.35;const pivotX=[152.0, 140.2, 134.8, 116.2, 101.2, 86.2, 143.2, 146.5, 129.8, 116.5, 109.5, 100.0, 151.5, 134.8, 128.0, 119.8, 106.5, 90.5, 150.0, 138.8, 129.8, 116.5, 106.0, 99.5];let aligned=true;function draw(){if(!ready)return;let row=Math.floor(frame/6),sx=frame%6*256,sy=rows[row],sh=rows[row+1]-sy,dy=canvas.height-24-(baselines[row]-sy)*scale;ctx.clearRect(0,0,canvas.width,canvas.height);const anchor=aligned?pivotX[frame]:128;const dx=canvas.width/2-anchor*scale;ctx.drawImage(sheet,sx,sy,256,sh,dx,dy,256*scale,sh*scale);if(document.querySelector('#guide').checked){ctx.save();ctx.strokeStyle='#d3536e';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(canvas.width/2,0);ctx.lineTo(canvas.width/2,canvas.height);ctx.stroke();ctx.restore()}counter.textContent=`${frame+1} / 24`;play.textContent=playing?'一時停止':'再生'}function duration(){return 1000/Number(fps.value)+(frame===23?450:0)}function tick(now){if(last!==null&&playing&&ready&&!document.hidden){elapsed+=Math.min(now-last,200);let changed=false;while(elapsed>=duration()){elapsed-=duration();frame=(frame+1)%24;changed=true}if(changed)draw()}last=now;requestAnimationFrame(tick)}play.onclick=()=>{playing=!playing;elapsed=0;last=null;draw()};next.onclick=()=>{playing=false;frame=(frame+1)%24;elapsed=0;draw()};fps.oninput=()=>{rate.textContent=fps.value+'fps';elapsed=0};document.addEventListener('visibilitychange',()=>{last=null;elapsed=0});sheet.onload=()=>{ready=true;play.disabled=next.disabled=false;draw();requestAnimationFrame(tick)};sheet.onerror=()=>{play.textContent='画像を読み込めません';};let bg=0;document.querySelector('#background').onclick=()=>{bg=(bg+1)%3;canvas.style.backgroundImage=bg?'none':'';canvas.style.backgroundColor=['#eee','#26364a','#f3ede2'][bg];document.querySelector('#background').textContent=['背景：市松','背景：紺','背景：生成り'][bg]};document.querySelector('#align').onclick=()=>{aligned=!aligned;document.querySelector('#align').textContent='横ずれ補正：'+(aligned?'ON':'OFF');document.querySelector('#align').setAttribute('aria-pressed',String(aligned));draw()};document.querySelector('#guide').onchange=draw;sheet.src='nika-victory-v4.png';
</script></html>
